# The bench's own settings come from FPGA_* environment variables through BenchSettings, and the
# database, the settings and the clock are handed to the application when it starts. What is here
# is only how Spring itself should behave.
spring.application.name=carrierworks
spring.main.banner-mode=off
server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=false
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
# Said out loud, because springdoc warns at every start that both are on when it is left to assume so.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
