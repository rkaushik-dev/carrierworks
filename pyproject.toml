[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga"
version = "0.1.0"
description = "Bench control plane for an FPGA prototyping and hardware in the loop lab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "rkaushik-dev" }]
dependencies = [
  "SQLAlchemy==2.0.38",
  "alembic==1.14.1",
  "fastapi==0.115.8",
  "pydantic==2.10.6",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "ruff==0.9.6",
  "mypy==1.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = [
  # Starlette's test client reaches for an anyio alias anyio has deprecated.
  # Not ours to fix, and not worth reading on every run.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET"]

[tool.ruff.lint.per-file-ignores]
# A test that a constructor refuses has to evaluate the expression on its own,
# and a test that stands a route up declares its dependencies the way a route
# does, which is as call defaults.
"tests/*" = ["B018", "B008"]
# Routes declare their dependencies as call defaults. That is the framework's
# calling convention and there is no other way to write it.
"src/fpga/api/*" = ["B008"]
# The timing and utilization reports are quoted exactly as the tools write
# them, and their table rows are wider than any line limit. Reflowing them
# would test a file no build has ever produced.
"tests/test_timing.py" = ["B018", "E501"]
"tests/test_utilization.py" = ["B018", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["fpga"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
