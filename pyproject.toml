[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga"
version = "0.1.0"
description = "Bench control plane for an FPGA prototyping and hardware in the loop lab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "rkaushik-dev" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.9.6",
  "mypy==1.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET"]

[tool.ruff.lint.per-file-ignores]
# A test that a constructor refuses has to evaluate the expression on its own.
"tests/*" = ["B018"]
# The timing and utilization reports are quoted exactly as the tools write
# them, and their table rows are wider than any line limit. Reflowing them
# would test a file no build has ever produced.
"tests/test_timing.py" = ["B018", "E501"]
"tests/test_utilization.py" = ["B018", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["fpga"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
